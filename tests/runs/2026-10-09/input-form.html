<!doctype html><html lang="en"><title>Demo submit</title><h1>Local submission demo</h1><form id="form"><label>Name <input id="name"></label><label>Email <input id="email"></label><label>Service mode <select id="service"><option>Available</option><option>Outage</option></select></label><button>Submit</button><p id="error"></p></form><script>document.getElementById('form').onsubmit=e=>{e.preventDefault();if(!document.getElementById('email').value.includes('@')||document.getElementById('service').value==='Outage'){document.getElementById('error').textContent='Invalid entry';document.getElementById('name').value='';document.getElementById('email').value=''}else document.getElementById('error').textContent='Local demo received'}</script></html>
